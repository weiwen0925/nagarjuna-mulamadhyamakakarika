<script>

const A=[
 {id:'A1',round:'開局',q:'法無量無邊，只破八件事，破得盡嗎？',basis:'各家說萬物從自在天、時、微塵生，或因中有果、無果',keep:'萬物總有一個實在的來源',

  next:'八事總破之後，論敵退回最直接的經驗：萬物明明現前，總有一種生法吧？'},
 {id:'A2',round:'第一回合',q:'萬物現前存在，總有一種生法吧？',basis:'可能性只有四種：自生、他生、共生、無因生',keep:'一個實有的生法',

 {id:'A3',round:'第二回合',q:'不從四門生也罷，諸法總有自性吧？',basis:'穀有穀性、芽有芽性，看起來現成',keep:'每一法自己的自性',

  const o=S.best[k];

}

function orderStage(key,list,title,hint){
  if(!S.sub) S.sub={pool:shuffle(list.map(x=>x.id)),seq:[],checked:false};
  const st=S.sub, byId=Object.fromEntries(list.map(x=>[x.id,x]));
  const head=`<div class="ptitle"><h2>${title}</h2><p>${list.length} 張卡</p></div><p class="hint">${hint}</p>`;
  if(!st.checked){
    const cards=st.pool.map(id=>{const p=st.seq.indexOf(id);return `<button class="ocard${p>=0?' sel':''}" data-id="${id}"><span class="n">${p>=0?p+1:''}</span><span class="t">${esc(byId[id].q)}</span></button>`;}).join('');
    $('#main').innerHTML=`<section class="panel">${head}<div class="olist">${cards}</div>
      <div class="bar"><span class="score">已排 ${st.seq.length} / ${list.length}　點已排的卡可退回</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" id="reset">重排</button><button class="btn" id="check" ${st.seq.length<list.length?'disabled':''}>核對</button></span></div></section>`;
    document.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,p=st.seq.indexOf(id);
      if(p>=0) st.seq=st.seq.slice(0,p); else st.seq.push(id);
      render();
    });
    $('#reset').onclick=()=>{st.seq=[];render();};
    $('#check').onclick=()=>{st.checked=true;render();};
    return;
  }
  const right=list.map(x=>x.id); let ok=0;
  const rows=right.map((id,i)=>{
    const good=st.seq[i]===id; if(good) ok++;
    const x=byId[id];
    const yours=good?'':`<span class="score">（你排在第 ${st.seq.indexOf(id)+1} 位）</span>`;
    const link=i<right.length-1&&x.next?`<p class="link">↓ ${esc(x.next)}</p>`:'';
    return `<div class="ocard ${good?'good':'badpos'}"><span class="n">${i+1}</span><span class="t">${esc(x.q)} ${yours}<br><span class="score">${esc(x.round)}　想保住：${esc(x.keep)}</span></span></div>${link}`;
  }).join('');
  saveBest(key,`${ok}/${list.length}`);
  $('#main').innerHTML=`<section class="panel">${head}
    <div class="end"><p class="big">${ok} / ${list.length}</p><p class="hint">綠色是位置正確，紅色是排錯的位置。每兩張卡之間的金字，就是論敵「為什麼下一步這樣問」。</p></div>
    <div class="olist">${rows}</div>
    <div class="bar"><button class="btn ghost" id="again">再排一次</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第二、四關：論敵出招・你來破 ───────── */
function duelStage(key,list,withBridge){
  if(!S.sub) S.sub={i:0,phase:'ask',score:0,bscore:0,opts:null,pick:null,mpick:null};
  const st=S.sub;
  if(st.i>=list.length){ return duelEnd(key,list,withBridge); }
  const x=list[st.i];
  if(!st.opts) st.opts=shuffle([x.id,...shuffle(list.filter(y=>y.id!==x.id).map(y=>y.id)).slice(0,3)]);
  const byId=Object.fromEntries(list.map(y=>[y.id,y]));
  const prev=st.i>0?list[st.i-1].next:'';
  const who=x.orig===false?'龍樹':'論敵';
  const qlab=x.orig===false?'收網':`第${cn(st.i+1)}問`;
  const meta=x.basis?`<p class="qmeta">根據：<b>${esc(x.basis)}</b>｜想保住：<b>${esc(x.keep)}</b></p>`:(x.orig?`<p class="qmeta">原典・問曰｜想保住：<b>${esc(x.keep)}</b></p>`:`<p class="qmeta">${who}自結｜選出龍樹收網的那一招</p>`);
  let html=`<section class="panel"><div class="ptitle"><h2>${withBridge?'過招・觀去來品':'過招・觀因緣品'}</h2><p>第 ${st.i+1} / ${list.length} 回合</p></div>
   ${prev?`<p class="retreat">${esc(prev)}</p>`:''}
   <div class="qrow"><div class="pill"><i>${qlab}</i><small>${esc(x.round)}</small></div><div class="qt"><p class="qbig">${x.orig?'「'+esc(x.q)+'」':esc(x.q)}</p>${meta}</div></div>
   <p class="hint">${x.orig===false?'哪一招是收網？':'龍樹用哪一招破它？'}</p>
   <div class="opts">${st.opts.map(id=>{const o=byId[id];let c='';
     if(st.phase!=='ask'){ if(id===x.id) c='right'; else if(id===st.pick) c='wrong'; else c='dim'; }
     return `<button class="opt ${c}" data-id="${id}" ${st.phase!=='ask'?'disabled':''}><strong>${esc(o.name)}</strong><span>${esc(o.tag)}</span></button>`;}).join('')}</div>`;
  if(st.phase!=='ask'){
    const good=st.pick===x.id, w=byId[st.pick];
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'破得正著':'這一招打偏了'}</h3>
      ${good?'':`<p>「${esc(w.name)}」是用來破「${esc(w.keep)}」的；這一問${who}想保住的是「${esc(x.keep)}」。正解是「${esc(x.name)}」。</p>`}
      <p><b>破在哪裡：</b>${esc(x.gist)}</p>${x.src.map(verseHTML).join('')}</div>`;
    if(withBridge){
      html+=`<div class="fb ${st.phase==='bridged'?(st.mpick===x.m?'ok':'no'):''}">
        <p class="knife">同一把刀：這一招在品一用過嗎？它用的是哪一種手法？</p>
        <div class="chips">${Object.entries(M).map(([k,m])=>{let c='';if(st.phase==='bridged'){if(k===x.m)c='right';else if(k===st.mpick)c='wrong';}
          return `<button class="chip ${c}" data-m="${k}" ${st.phase==='bridged'?'disabled':''} title="${esc(m.d)}">${esc(m.name)}</button>`;}).join('')}</div>`;
      if(st.phase==='bridged'){
        html+=`<p><b>${esc(M[x.m].name)}：</b>${esc(M[x.m].d)}。${st.mpick===x.m?'':'（你選的是「'+esc(M[st.mpick].name)+'」）'}</p>
        <div class="bridge"><div class="bcol"><div class="lab">${esc(x.b1.lab)}</div><p class="quote">「${esc(x.b1.q)}」</p></div>
        <div class="bcol"><div class="lab">${esc(x.b2.lab)}</div><p class="quote">「${esc(x.b2.q)}」</p></div></div>`;
      }
      html+=`</div>`;
    }
    const canNext=!withBridge||st.phase==='bridged';
    html+=`<div class="bar"><span class="score">破對 ${st.score}${withBridge?`｜同一把刀 ${st.bscore}`:''}</span><button class="btn" id="nx" ${canNext?'':'disabled'}>${st.i===list.length-1?'看結果':'下一回合'}</button></div>`;
  } else {
    html+=`<div class="bar"><span class="score">破對 ${st.score}${withBridge?`｜同一把刀 ${st.bscore}`:''}</span></div>`;
  }
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.pick=b.dataset.id;if(st.pick===x.id)st.score++;st.phase='answered';render();});
  document.querySelectorAll('.chip[data-m]').forEach(b=>b.onclick=()=>{st.mpick=b.dataset.m;if(st.mpick===x.m)st.bscore++;st.phase='bridged';render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.phase='ask';st.opts=null;st.pick=null;st.mpick=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}
function duelEnd(key,list,withBridge){
  const st=S.sub,n=list.length;
  saveBest(key,`${st.score}/${n}`);
  const methods=withBridge?`<div class="olist">${Object.entries(M).map(([k,m])=>{
      const ex=list.filter(x=>x.m===k).map(x=>x.name).join('、');
      return `<div class="ocard"><span class="t">${esc(m.name)}<br><span class="score">${esc(m.d)}。品二用在：${esc(ex)}</span></span></div>`;}).join('')}</div>`:'';
  $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>${withBridge?'觀去來品過招結束':'觀因緣品過招結束'}</h2></div>
   <div class="end"><p class="big">破對 ${st.score} / ${n}${withBridge?`　同一把刀 ${st.bscore} / ${n}`:''}</p>
   <p class="hint">${withBridge?'品二的每一刀，品一都用過。下面是五種手法的總表：品一先在「生」上練刀，品二換成「去」來試。':'九問一路退守，最後連「緣、非緣」都放下。下一關換觀去來品的論敵原話。'}</p></div>
   ${methods}
   <div class="bar"><button class="btn ghost" id="again">再打一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第五關：頌文填空 ───────── */
function fillStage(){
  if(!S.sub) S.sub={list:shuffle(F.map((_,i)=>i)).slice(0,10),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest('f',`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>頌文填空結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">每輪從十七首頌文中隨機抽十首，多玩幾輪就能全部遇到。</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const f=F[st.list[st.i]];
  if(!st.opts) st.opts=shuffle(f.opts);
  const lines=f.v.map((l,j)=>{
    if(j!==f.ln) return `<p class="ln">${esc(l)}</p>`;
    const p=l.indexOf(f.ans);
    const fill=st.pick?`<span class="blank filled">${esc(f.ans)}</span>`:`<span class="blank">　</span>`;
    return `<p class="ln">${esc(l.slice(0,p))}${fill}${esc(l.slice(p+f.ans.length))}</p>`;
  }).join('');
  let html=`<section class="panel"><div class="ptitle"><h2>頌文填空</h2><p>第 ${st.i+1} / ${st.list.length} 首</p></div>
    <p class="hint">選出空格裡的字。原典一字不改，填的是鳩摩羅什譯本的原文。</p>
    <div class="verse"><div class="lab">${esc(f.lab)}</div>${lines}</div>
    <div class="chips">${st.opts.map(o=>{let c='';if(st.pick){if(o===f.ans)c='right';else if(o===st.pick)c='wrong';}
      return `<button class="chip ${c}" data-o="${esc(o)}" ${st.pick?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  if(st.pick){
    const good=st.pick===f.ans;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是「'+esc(st.pick)+'」'}</h3><p>這首頌在破法裡的位置：<b>${esc(f.note)}</b>。</p></div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一首'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.chip[data-o]').forEach(b=>b.onclick=()=>{st.pick=b.dataset.o;if(st.pick===f.ans)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();};
}

/* ───────── 第六關：配對快打 ───────── */
let timer=null;
function matchStage(){
  if(!S.sub){
    const pool=shuffle([...A,...B.filter(x=>x.orig)]).slice(0,6);
    S.sub={pairs:pool,left:shuffle(pool.map(x=>x.id)),right:shuffle(pool.map(x=>x.id)),done:[],pickL:null,miss:0,t0:null,t:0,bad:null};
  }
  const st=S.sub, byId=Object.fromEntries(st.pairs.map(x=>[x.id,x]));
  const finished=st.done.length===st.pairs.length;
  if(finished&&timer){clearInterval(timer);timer=null;saveBest('m',+st.t.toFixed(1),true);}
  const src=x=>x.id[0]==='A'?'品一':'品二';
  let html=`<section class="panel"><div class="ptitle"><h2>配對快打</h2><p>品一、品二混合，每輪六組</p></div>
   <p class="hint">先點左邊「論敵想保住的」，再點右邊龍樹破它的那一招。配錯會記一次失手。</p>
   <div class="bar"><span class="score" id="clock">用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / 6</span>${S.best.m!=null?`<span class="score">最佳 ${S.best.m} 秒</span>`:''}</div>
   <div class="mgrid"><div class="mcol"><h4>論敵想保住</h4>${st.left.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.pickL===id?'pick':'');
      return `<button class="mi ${c}" data-l="${id}" ${st.done.includes(id)?'disabled':''}><span class="src">${src(x)}</span>${esc(x.keep)}</button>`;}).join('')}</div>
   <div class="mcol"><h4>龍樹的招</h4>${st.right.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.bad===id?'shake':'');
      return `<button class="mi ${c}" data-r="${id}" ${st.done.includes(id)?'disabled':''}>${esc(x.name)}</button>`;}).join('')}</div></div>`;
  if(finished) html+=`<div class="end"><p class="big">${st.t.toFixed(1)} 秒・失手 ${st.miss}</p><p class="hint">六組全配上了。再來一輪會換一批題。</p><div class="bar" style="width:100%"><button class="btn" id="again">再來一輪</button><button class="btn ghost" id="first">回第一關</button></div></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.mi[data-l]').forEach(b=>b.onclick=()=>{
    if(!st.t0){st.t0=performance.now();timer=setInterval(()=>{st.t=(performance.now()-st.t0)/1000;const c=$('#clock');if(c)c.textContent=`用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / 6`;},100);}
    st.pickL=b.dataset.l;st.bad=null;render();
  });
  document.querySelectorAll('.mi[data-r]').forEach(b=>b.onclick=()=>{
    if(!st.pickL) return;
    if(b.dataset.r===st.pickL){st.done.push(st.pickL);st.pickL=null;st.bad=null;}
    else{st.miss++;st.bad=b.dataset.r;}
    render();
  });
  const ag=$('#again'); if(ag) ag.onclick=()=>{S.sub=null;st.t=0;render();};
  const fs=$('#first'); if(fs) fs.onclick=()=>go(0);
  renderNav();
}

/* ───────── 開場 ───────── */
function start(d){
  const h=(location.hash||'').slice(1), hi=STAGES.findIndex(s=>s.k===h);
  if(hi>=0) S.stage=hi;
  if(d&&typeof d.stage==='number'){S.stage=d.stage;S.sub=d.sub||null;}
  renderNav();render();
}
window.claude?.hot?.snapshot?.(()=>({stage:S.stage,sub:S.stage===5?null:S.sub}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
